<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Seguridad: misma política que index.html. Ver allí el porqué de
         cada directiva y qué no cubre. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk='; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta name="description" content="Recorre una Bajaj pieza por pieza: motor, suspensión, frenos y depósito, con las fotografías de detalle de cada modelo. ARENAS MOTOCICLETAS, Cusco." />
    <meta name="author" content="ARENAS MOTOCICLETAS" />
    <meta name="theme-color" content="#ffffff" />

    <!-- `noindex` a propósito: esta página es una plantilla paramétrica.
         Sin ?slug= no representa a ninguna moto, y dejar que un buscador
         indexe la versión vacía sería publicar una página sin contenido.
         Las fichas de modelo, esas sí se indexan. -->
    <meta name="robots" content="noindex, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="Recorre la moto pieza por pieza — ARENAS MOTOCICLETAS" />
    <meta property="og:description" content="Motor, suspensión, frenos y depósito, de cerca." />
    <meta property="og:site_name" content="ARENAS MOTOCICLETAS" />

    <title>Explorar — ARENAS MOTOCICLETAS</title>

    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="assets/css/explorar.css" />

    <script>document.documentElement.classList.add("js");</script>
  </head>

  <body class="explorar">
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <header class="ex-header" role="banner">
      <a class="ex-header__marca" href="index.html" aria-label="ARENAS MOTOCICLETAS, ir al inicio">
        <img src="assets/branding/arenas-logo-oficial.png" width="900" height="144" alt="" />
      </a>
      <nav class="ex-header__nav" aria-label="Navegación">
        <a href="catalogo.html">Catálogo</a>
        <a href="modelo.html" class="ex-header__cta" id="ex-ficha-cta">Ver ficha</a>
      </nav>
    </header>

    <main id="main-content" role="main" tabindex="-1">

      <!-- ============================================================
           APERTURA
           Fondo blanco y la moto entera, sin nada más. Es el único
           momento en que se ve completa: a partir de aquí el recorrido
           entra en las piezas.

           Todo lo que hay debajo llega vacío y lo rellena explorar.js
           con los datos del catálogo y de la ficha editorial. No se
           escribe aquí ningún texto de una moto concreta: esta página
           sirve a las ocho.
      ============================================================ -->
      <section class="ex-intro" aria-labelledby="ex-titulo">
        <div class="ex-intro__texto">
          <p class="ex-kicker" id="ex-kicker"></p>
          <h1 id="ex-titulo" class="ex-titulo"></h1>
          <p class="ex-lead" id="ex-lead"></p>
          <p class="ex-pista" aria-hidden="true">Baja para recorrerla</p>
        </div>

        <figure class="ex-intro__moto">
          <img id="ex-portada" src="data:," alt="" decoding="async" fetchpriority="high" />
        </figure>
      </section>

      <!-- ============================================================
           RECORRIDO POR LAS PIEZAS

           El escenario se queda fijo y los pasos pasan por debajo. Cada
           paso enciende su fotografía: no hay corte entre una pieza y la
           siguiente, hay un cambio de plano sobre la misma moto.

           Las fotografías son las mismas que ya usa la ficha del modelo,
           tomadas pieza a pieza. Los textos también: son las razones de
           compra que ya estaban escritas y revisadas.
      ============================================================ -->
      <div class="ex-recorrido">
        <div class="ex-escenario" aria-hidden="true">
          <div class="ex-escenario__caja" id="ex-caja"></div>
          <ol class="ex-puntos" id="ex-puntos"></ol>
        </div>

        <div class="ex-pasos" id="ex-pasos">
          <noscript>
            <p class="catalog-noscript">
              Este recorrido necesita JavaScript para cargarse. La ficha completa de cada
              moto está en el <a href="catalogo.html">catálogo</a>.
            </p>
          </noscript>
        </div>
      </div>

      <!-- ============================================================
           CIERRE
      ============================================================ -->
      <section class="ex-cierre" aria-labelledby="ex-cierre-titulo">
        <h2 id="ex-cierre-titulo" class="ex-cierre__titulo">¿Te la enseñamos en persona?</h2>
        <p class="ex-cierre__texto">
          Está en el salón, en la Av. La Cultura. Escríbenos y te contamos disponibilidad.
        </p>
        <div class="ex-cierre__acciones">
          <a class="btn btn-primary btn-hero" href="catalogo.html" id="ex-cierre-cta">Ver ficha completa</a>
          <a class="ex-cierre__secundario" href="catalogo.html">Ver todos los modelos &rarr;</a>
        </div>
      </section>
    </main>

    <!-- El mismo orden que modelo.html: utilidades, contrato de datos y
         datos antes que nada que los use. La capa editorial aporta los
         textos y la resolución de fotografías; explorar.js solo compone. -->
    <script src="assets/js/catalogo/catalogo-utils.js" defer></script>
    <script src="assets/js/catalogo/catalogo-schema.js" defer></script>
    <script src="assets/js/catalogo/catalogo-data.js" defer></script>
    <script src="assets/js/catalogo/modelo-editorial.js" defer></script>
    <script src="assets/js/explorar.js" defer></script>
  </body>
</html>
